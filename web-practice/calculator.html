<!DOCTYPE html>
<html lang="en">

<head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Calculator</title>

          <script>
                    function calculate(operation) {
                              const num1 = parseFloat(document.getElementById('num1').value);
                              const num2 = parseFloat(document.getElementById('num2').value);
                              let result;

                              switch (operation) {
                                        case '+':
                                                  result = num1 + num2;
                                                  break;
                                        case '-':
                                                  result = num1 - num2;
                                                  break;
                                        case 'x':
                                                  result = num1 * num2;
                                                  break;
                                        case '/':
                                                  result = num1 / num2;
                                                  break;
                              }

                              document.getElementById('output').value = result;
                    }

                    function clearFields() {
                              document.getElementById('num1').value = '';
                              document.getElementById('num2').value = '';
                              document.getElementById('output').value = '';
                    }

          </script>

          <style>
                    input {
                              margin: 5px;
                              padding: 15px;
                              width: 50%;
                    }

                    button {
                              width: 90px;
                              margin: 5px;
                    }

                    button:hover {
                              background-color: #ddd;
                    }

                    body {
                              font-family: Arial, sans-serif;
                              text-align: center;
                              margin-top: 50px;
                    }

                    .container {
                              background: black;
                              width: 50%;
                              justify-self: center;
                              padding: 20px;
                    }
          </style>
</head>

<body>
          <div class="container">
                    <input type="number" id="num1" placeholder="Add first number">
                    <br>
                    <input type="number" id="num2" placeholder="Add second number">
                    <br>
                    <button onclick="calculate('+')">Add</button>
                    <button onclick="calculate('-')">Minus</button>
                    <button onclick="calculate('x')">Multiply</button>
                    <button onclick="calculate('/')">Divide</button>
                    <button onclick="clearFields()">Clear</button>
                    <br>
                    <input type="number" id="output" placeholder="The answer is...">
          </div>
</body>

</html>
